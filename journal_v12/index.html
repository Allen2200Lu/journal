<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c63ff"><link rel="manifest" href="manifest.webmanifest"><title>Journal V1.2</title><style>
:root{--accent:#6c63ff;--bg:#f5f6fb;--card:#fff;--text:#20232a;--muted:#737886;--danger:#d64545}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{padding:22px 18px 10px}h1,h2,h3{margin:0 0 10px}.wrap{max-width:760px;margin:auto;padding:0 14px 90px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:5}.tabs button{flex:1;max-width:190px;border:0;background:none;padding:12px 4px;font-size:13px;color:var(--muted)}.tabs button.active{color:var(--accent);font-weight:700}.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000009}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{font-size:25px;font-weight:800}.muted{color:var(--muted);font-size:13px}label{display:block;font-weight:650;font-size:14px;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #d8dae2;border-radius:11px;background:#fff;font:inherit}textarea{min-height:90px}button.primary,button.small{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:11px 15px;font-weight:700}button.small{font-size:13px;padding:8px 11px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;background:#eeeefe;color:#5148c7;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.entry{border-top:1px solid #eee;padding:12px 0}.entry:first-child{border-top:0}.danger{color:var(--danger)}#lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:25px}.lockbox{max-width:400px;width:100%}.hidden{display:none!important}.notice{background:#fff8dd;padding:11px;border-radius:12px;font-size:13px}.photo{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px}.theme{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd}.swatches{display:flex;gap:10px;margin-top:8px}
</style></head><body><div id="lock"><div class="lockbox"><div class="card"><h1>🔒 Journal</h1><p class="muted">首次使用請設定本機密碼。密碼只用於解鎖本機資料。</p><input id="pw" type="password" placeholder="密碼"><button class="primary" style="width:100%;margin-top:10px" onclick="unlock()">解鎖</button><p id="lockmsg" class="danger"></p></div></div></div><div id="app" class="hidden"><header><h1>Journal</h1><div class="muted" id="today"></div></header><main class="wrap"><section id="home"></section><section id="records" class="hidden"></section><section id="stats" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs"><button onclick="show('home',this)" class="active">🏠 首頁</button><button onclick="show('records',this)">📝 紀錄</button><button onclick="show('stats',this)">📊 統計</button><button onclick="show('settings',this)">⚙️ 設定</button></nav></div><script>
const DB='journal-v12',ST='entries';let db,entries=[],selectedMonth=new Date().toISOString().slice(0,7),settings={accent:'#6c63ff',lockMinutes:15};
const $=id=>document.getElementById(id);function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST,{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}async function load(){entries=await new Promise(r=>{let q=db.transaction(ST).objectStore(ST).getAll();q.onsuccess=()=>r(q.result||[]) });let s=await new Promise(r=>{let q=db.transaction('settings').objectStore('settings').get('settings');q.onsuccess=()=>r(q.result?.value||{})});settings={...settings,...s};document.documentElement.style.setProperty('--accent',settings.accent);}
function saveEntry(x){return new Promise(r=>{let q=db.transaction(ST,'readwrite').objectStore(ST).put(x);q.onsuccess=r})}function delEntry(id){return new Promise(r=>{let q=db.transaction(ST,'readwrite').objectStore(ST).delete(id);q.onsuccess=r})}function saveSettings(){return new Promise(r=>{let q=db.transaction('settings','readwrite').objectStore('settings').put({key:'settings',value:settings});q.onsuccess=r})}
function fmtMin(n){n=+n||0;return n>=60?Math.floor(n/60)+'小時 '+n%60+'分':n+'分鐘'}function fmtDate(x){return new Date(x).toLocaleString('zh-TW',{hour12:false})}function lastEjac(){return entries.filter(e=>e.ejaculated).sort((a,b)=>b.date-a.date)[0]?.date}function abst(){let d=lastEjac();return d?Math.floor((Date.now()-d)/86400000):null}function tagsHTML(tags=[]){return tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderHome(){let now=new Date(),m=now.toISOString().slice(0,7),a=entries.filter(e=>new Date(e.date).toISOString().slice(0,7)==m),ej=a.filter(e=>e.ejaculated).length,total=a.reduce((s,e)=>s+(+e.duration||0),0);$('home').innerHTML=`<div class="grid"><div class="card"><div class="muted">本月活動</div><div class="stat">${a.length}</div></div><div class="card"><div class="muted">本月射精</div><div class="stat">${ej}</div></div></div><div class="card"><h2>🔥 目前禁慾</h2><div class="stat">${abst()==null?'尚無射精紀錄':abst()+' 天'}</div><div class="muted">只在「射精」紀錄後歸零；單純活動不會歸零。</div></div><div class="card"><h2>＋ 新增紀錄</h2><label>日期時間</label><input id="date" type="datetime-local" value="${localInput(new Date())}"><label>類型</label><select id="type"><option>自慰</option><option>性行為</option></select><label>持續時間（分鐘）</label><input id="duration" type="number" min="0" value="0"><label>是否射精</label><select id="ejac"><option value="0">否</option><option value="1">是</option></select><label>射精次數</label><input id="count" type="number" min="0" value="0"><label>標籤（逗號分隔，可自訂）</label><input id="tags" placeholder="例如：控射,長時間"><label>性伴侶（選填）</label><input id="partner" placeholder="可留空"><label>備註</label><textarea id="notes"></textarea><label>照片</label><input id="photo" type="file" accept="image/*"><button class="primary" style="margin-top:12px;width:100%" onclick="add()">儲存紀錄</button></div>`}
function localInput(d){let z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}async function add(){let f=$('photo').files[0],photo=f?await readFile(f):null;let x={id:crypto.randomUUID(),date:new Date($('date').value).getTime(),type:$('type').value,duration:+$('duration').value||0,ejaculated:$('ejac').value==='1',count:+$('count').value||0,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),partner:$('partner').value,notes:$('notes').value,photo};await saveEntry(x);await load();render();alert('已儲存')}function readFile(f){return new Promise(r=>{let q=new FileReader();q.onload=()=>r(q.result);q.readAsDataURL(f)})}
function renderRecords(){let arr=entries.filter(e=>new Date(e.date).toISOString().slice(0,7)==selectedMonth).sort((a,b)=>b.date-a.date);$('records').innerHTML=`<div class="card"><h2>歷史紀錄</h2><input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;renderRecords()">${arr.length?arr.map(e=>`<div class="entry"><b>${fmtDate(e.date)}</b> · ${esc(e.type)} · ${fmtMin(e.duration)}</div><div class="muted">${e.ejaculated?'射精 '+e.count+' 次':'未射精'} ${tagsHTML(e.tags)}</div>${e.partner?`<div class="muted">伴侶：${esc(e.partner)}</div>`:''}${e.notes?`<div>${esc(e.notes)}</div>`:''}${e.photo?`<img class="photo" src="${e.photo}">`:''}<button class="small danger" onclick="removeEntry('${e.id}')">刪除</button></div>`).join(''):'<p class="muted">本月沒有紀錄。</p>'}</div>`}async function removeEntry(id){if(confirm('刪除此紀錄？')){await delEntry(id);await load();render()}}
function rangeStats(arr){return {n:arr.length,ej:arr.filter(e=>e.ejaculated).length,min:arr.reduce((s,e)=>s+(+e.duration||0),0)}}function month(m){return entries.filter(e=>new Date(e.date).toISOString().slice(0,7)==m)}function renderStats(){let d=new Date(),m=d.toISOString().slice(0,7),pm=new Date(d.getFullYear(),d.getMonth()-1,1).toISOString().slice(0,7),a=rangeStats(month(m)),b=rangeStats(month(pm));let years=[...new Set(entries.map(e=>new Date(e.date).getFullYear()))].sort((a,b)=>b-a);$('stats').innerHTML=`<div class="card"><h2>📊 本月 vs 上月</h2><div class="grid"><div><b>${m}</b><p>活動 ${a.n}<br>射精 ${a.ej}<br>時長 ${fmtMin(a.min)}</p></div><div><b>${pm}</b><p>活動 ${b.n}<br>射精 ${b.ej}<br>時長 ${fmtMin(b.min)}</p></div></div></div><div class="card"><h2>🔥 禁慾</h2><p>目前：<b>${abst()==null?'—':abst()+' 天'}</b></p><p>歷史最高：<b>${maxStreak()} 天</b></p></div><div class="card"><h2>🏷️ 標籤統計</h2>${tagStats()}</div><div class="card"><h2>📅 年度</h2>${years.map(y=>{let s=rangeStats(entries.filter(e=>new Date(e.date).getFullYear()==y));return `<div class="entry"><b>${y}</b>：${s.n} 次活動・${s.ej} 次射精・${fmtMin(s.min)}</div>`}).join('')||'<p class="muted">尚無資料</p>'}</div>`}function tagStats(){let m={};entries.forEach(e=>(e.tags||[]).forEach(t=>{m[t]=(m[t]||0)+1}));return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag">${esc(k)} × ${v}</span>`).join('')||'<span class="muted">尚無標籤</span>'}function maxStreak(){let xs=entries.filter(e=>e.ejaculated).map(e=>e.date).sort((a,b)=>a-b);if(!xs.length)return abst()??0;let best=0;for(let i=1;i<xs.length;i++)best=Math.max(best,Math.floor((xs[i]-xs[i-1])/86400000));return Math.max(best,Math.floor((Date.now()-xs.at(-1))/86400000))}
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>🎨 主題</h2><div class="swatches">${['#6c63ff','#007aff','#00a878','#ff8a00','#d64f8c','#333333'].map(c=>`<button class="theme" style="background:${c}" onclick="setTheme('${c}')"></button>`).join('')}</div><label>自動鎖定（分鐘）</label><input type="number" min="0" value="${settings.lockMinutes}" onchange="settings.lockMinutes=+this.value||0;saveSettings()"><p class="muted">0 = 不自動鎖定。鎖定目前是本機介面鎖，之後可升級為真正加密儲存。</p></div><div class="card"><h2>💾 備份</h2><button class="primary" onclick="exportData()">匯出 JSON</button> <label>匯入 JSON</label><input type="file" accept="application/json" onchange="importData(this)"></div><div class="card"><h2>⚠️ 資料</h2><button class="small danger" onclick="wipe()">刪除全部紀錄</button></div>`}async function setTheme(c){settings.accent=c;document.documentElement.style.setProperty('--accent',c);await saveSettings();renderSettings()}function exportData(){let blob=new Blob([JSON.stringify({schemaVersion:2,exportedAt:new Date().toISOString(),entries})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='journal-backup.json';a.click()}async function importData(el){let f=el.files[0];if(!f)return;let x=JSON.parse(await f.text());for(let e of x.entries||[])await saveEntry(e);await load();render();alert('匯入完成')}async function wipe(){if(confirm('確定刪除全部紀錄？')){let q=db.transaction(ST,'readwrite').objectStore(ST).clear();q.onsuccess=()=>{load().then(render)}}}
function show(id,btn){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}function render(){renderHome();renderRecords();renderStats();renderSettings();$('today').textContent=new Date().toLocaleDateString('zh-TW')}async function unlock(){let p=$('pw').value;if(!localStorage.getItem('journal_pw')){localStorage.setItem('journal_pw',await hash(p));$('lock').classList.add('hidden');$('app').classList.remove('hidden');start()}else if(localStorage.getItem('journal_pw')===await hash(p)){$('lock').classList.add('hidden');$('app').classList.remove('hidden');start()}else $('lockmsg').textContent='密碼錯誤'}async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function start(){openDB().then(load).then(render);let last=Date.now();document.addEventListener('visibilitychange',()=>{if(document.hidden)last=Date.now();else if(settings.lockMinutes&&Date.now()-last>settings.lockMinutes*60000)location.reload()})}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
