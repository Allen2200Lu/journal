<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>私密紀錄</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}header{position:sticky;top:0;background:#f5f7fbf2;backdrop-filter:blur(12px);z-index:2;border-bottom:1px solid #e5e9f0}.wrap{max-width:900px;margin:auto;padding:14px 16px}.brand{font-size:21px;font-weight:800}.sub,.muted{color:#718096;font-size:12px}nav{display:flex;gap:6px;margin-top:10px;overflow:auto}button,select,input,textarea{font:inherit}nav button,.ghost{border:1px solid #e5e9f0;background:#fff;border-radius:11px;padding:9px 13px;font-weight:700}nav button.active{background:#172033;color:#fff}main{padding:18px 16px 80px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:17px;padding:15px;margin-top:12px}.n{font-size:23px;font-weight:850}.primary{border:0;border-radius:13px;padding:11px 15px;color:#fff;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6)}.section{margin-top:16px}.section h2{font-size:15px;margin:0 0 10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#718096;font-size:11px}.day{min-height:48px;border:1px solid #e5e9f0;border-radius:9px;padding:5px;font-size:12px;background:#fff}.dot{display:block;width:7px;height:7px;border-radius:50%;background:#6366f1;margin-top:13px}.sex{background:#8b5cf6}.entries{display:grid;gap:9px}.entry{display:flex;justify-content:space-between;gap:8px}.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#eef2ff;color:#4f46e5;font-weight:750}.meta{font-size:12px;color:#718096;margin-top:5px}.thumbs{display:flex;gap:5px;margin-top:8px}.thumbs img{width:50px;height:50px;object-fit:cover;border-radius:8px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #e5e9f0;border-radius:10px;background:#fff}.field textarea{min-height:75px}.seg{display:flex;background:#eef1f6;padding:4px;border-radius:11px}.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px}.seg .active{background:#fff;font-weight:800}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.delta{font-size:12px;margin-top:5px}.up{color:#059669}.down{color:#dc2626}.modal{position:fixed;inset:0;background:#0f172a88;z-index:10;display:flex;align-items:flex-end}.sheet{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.hidden{display:none}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div class="wrap"><div class="brand">私密紀錄</div><div class="sub">Sex Journal · 本機資料版</div><nav><button data-page="home" class="active">總覽</button><button data-page="records">紀錄</button><button data-page="stats">分析</button><button data-page="settings">設定</button></nav></div></header><main class="wrap" id="app"></main>
<div id="modal" class="modal hidden"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>新增／編輯紀錄</h2><form id="form"><input id="id" type="hidden"><div class="field"><label>日期／時間</label><input id="dt" type="datetime-local" required></div><div class="field"><label>類型</label><div class="seg"><button type="button" id="bm" class="active" onclick="setType('mast')">自慰</button><button type="button" id="bs" onclick="setType('sex')">性愛</button></div></div><div class="field"><label>持續時間（分鐘）</label><input id="duration" type="number" min="0"></div><div class="field"><label><input id="ejac" type="checkbox"> 有射精</label></div><div class="field"><label>射精次數</label><input id="ejacCount" type="number" min="0" value="0"></div><div class="field"><label>滿意度</label><select id="rating"><option value="">未評分</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div id="sexBox" class="field hidden"><label>對象（可留空）</label><input id="partner"></div><div class="field"><label>照片（可選）</label><input id="photos" type="file" accept="image/*" multiple></div><div class="field"><label>備註</label><textarea id="notes"></textarea></div><button class="primary" type="submit">儲存</button></form></div></div>
<script>
const DB='SexJournalDB',STORE='entries';let page='home',type='mast';
const $=id=>document.getElementById(id);function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function all(){return openDB().then(d=>new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}function put(e){return openDB().then(d=>new Promise((ok,no)=>{let r=d.transaction(STORE,'readwrite').objectStore(STORE).put(e);r.onsuccess=ok;r.onerror=()=>no(r.error)}))}function remove(id){return openDB().then(d=>new Promise((ok,no)=>{let r=d.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)}))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function month(es,y,m){return es.filter(e=>{let d=new Date(e.dt);return d.getFullYear()==y&&d.getMonth()==m})}function S(es){let d=es.filter(e=>e.duration>0);return{all:es.length,sex:es.filter(e=>e.type==='sex').length,mast:es.filter(e=>e.type==='mast').length,ej:es.reduce((a,e)=>a+(+e.ejacCount||0),0),avg:d.length?Math.round(d.reduce((a,e)=>a+e.duration,0)/d.length):0,max:d.length?Math.max(...d.map(e=>e.duration)):0}}function cards(s){return '<div class="grid">'+[['活動',s.all],['性愛',s.sex],['自慰',s.mast],['射精',s.ej],['平均分鐘',s.avg||'—'],['最長分鐘',s.max||'—']].map(x=>`<div class="card"><div class="n">${x[1]}</div><div class="muted">${x[0]}</div></div>`).join('')+'</div>'}
function entry(e){return `<div class="card entry"><div><span class="badge">${e.type==='sex'?'性愛':'自慰'}</span><div style="font-weight:800;margin-top:7px">${new Date(e.dt).toLocaleString('zh-TW')}</div><div class="meta">${e.duration||0} 分鐘 · ${e.ejacCount||0} 次射精${e.rating?' · ★'+e.rating:''}${e.partner?' · '+esc(e.partner):''}</div>${e.notes?'<div class="meta">'+esc(e.notes)+'</div>':''}${e.photos?.length?'<div class="thumbs">'+e.photos.slice(0,5).map(p=>`<img src="${p}">`).join('')+'</div>':''}</div><div><button class="ghost" onclick="editEntry('${e.id}')">編輯</button><button class="ghost" onclick="deleteEntry('${e.id}')">刪除</button></div></div>`}
function cal(es,y,m){let f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),o='<div class="calendar">'+['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<f;i++)o+='<div></div>';for(let d=1;d<=n;d++){let a=es.filter(e=>{let z=new Date(e.dt);return z.getFullYear()==y&&z.getMonth()==m&&z.getDate()==d});o+=`<div class="day">${d}${a.length?`<span class="dot ${a.some(x=>x.type==='sex')?'sex':''}"></span>`:''}</div>`}return o+'</div>'}
function nav(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()})}
async function render(){let es=await all();es.sort((a,b)=>b.dt.localeCompare(a.dt));if(page==='home'){let n=new Date(),m=month(es,n.getFullYear(),n.getMonth());$('app').innerHTML=`<div class="row between"><div><h1 style="margin:0">本月總覽</h1><div class="sub">${n.toLocaleDateString('zh-TW',{year:'numeric',month:'long'})}</div></div><button class="primary" onclick="openModal()">＋ 新增</button></div>${cards(S(m))}<div class="card"><h2>本月日曆</h2>${cal(es,n.getFullYear(),n.getMonth())}</div><div class="section"><h2>最近紀錄</h2><div class="entries">${es.slice(0,5).map(entry).join('')||'<div class="card muted">尚無紀錄</div>'}</div></div>`}else if(page==='records'){let ms=months(es);$('app').innerHTML=`<div class="row between"><h1 style="margin:0">歷史紀錄</h1><button class="primary" onclick="openModal()">＋ 新增</button></div><div class="card"><select id="filter" onchange="filterRecords()"><option value="all">全部月份</option>${ms.map(x=>`<option value="${x.k}">${x.label}</option>`).join('')}</select></div><div id="list" class="section entries">${es.map(entry).join('')}</div>`}else if(page==='stats')renderStats(es);else renderSettings()}
function months(es){let o={};es.forEach(e=>{let d=new Date(e.dt),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');o[k]=d.toLocaleDateString('zh-TW',{year:'numeric',month:'long'})});return Object.keys(o).sort().reverse().map(k=>({k,label:o[k]}))}async function filterRecords(){let es=await all(),v=$('filter').value;if(v!=='all')es=es.filter(e=>e.dt.slice(0,7)===v);$('list').innerHTML=es.sort((a,b)=>b.dt.localeCompare(a.dt)).map(entry).join('')||'<div class="card muted">沒有紀錄</div>'}
function renderStats(es){let n=new Date(),a=month(es,n.getFullYear(),n.getMonth()),p=new Date(n.getFullYear(),n.getMonth()-1,1),b=month(es,p.getFullYear(),p.getMonth());$('app').innerHTML=`<h1 style="margin:0">分析與比較</h1><div class="compare"><div class="card"><h2>本月</h2>${cards(S(a))}</div><div class="card"><h2>上月</h2>${cards(S(b))}</div></div><div class="card"><h2>本週 vs 上週</h2><div id="week"></div></div><div class="card"><h2>本月 vs 指定月份</h2><select id="cm"><option value="">選擇月份</option>${months(es).map(x=>`<option value="${x.k}">${x.label}</option>`).join('')}</select><button class="primary" style="margin-top:8px" onclick="compareSelected()">比較</button><div id="selected"></div></div><div class="card"><h2>最近 12 個月</h2><div id="year12"></div></div><div class="card"><h2>年度比較</h2><div class="row"><select id="y1"></select><select id="y2"></select><button class="primary" onclick="compareYears()">比較</button></div><div id="years"></div></div>`;weekCompare(es);render12(es);let ys=[...new Set(es.map(e=>new Date(e.dt).getFullYear()))].sort((x,y)=>y-x);if(!ys.length)ys=[n.getFullYear()];$('y1').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');$('y2').innerHTML=ys.map(y=>`<option>${y-1}</option>`).join('')}
function deltaRow(a,b){return [['活動',a.all,b.all],['性愛',a.sex,b.sex],['自慰',a.mast,b.mast],['射精',a.ej,b.ej],['平均分鐘',a.avg,b.avg]].map(x=>{let d=x[1]-x[2];return `<div class="row between" style="padding:7px 0;border-bottom:1px solid #e5e9f0"><span>${x[0]}</span><b class="${d>0?'up':d<0?'down':''}">${x[1]} <small>(${d>=0?'+':''}${d})</small></b></div>`}).join('')}
function weekStart(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function range(es,start,end){return es.filter(e=>{let t=new Date(e.dt);return t>=start&&t<end})}function weekCompare(es){let s=weekStart(new Date()),e=new Date(s);e.setDate(e.getDate()+7);let ps=new Date(s);ps.setDate(ps.getDate()-7),a=range(es,s,e),b=range(es,ps,s);$('week').innerHTML=deltaRow(S(a),S(b))}function compareSelected(){all().then(es=>{let v=$('cm').value;if(!v)return;let [y,m]=v.split('-').map(Number),a=month(es,y,m-1),n=new Date(),b=month(es,n.getFullYear(),n.getMonth());$('selected').innerHTML='<div class="section">指定月份 vs 本月</div>'+deltaRow(S(a),S(b))})}function render12(es){let n=new Date(),o='<div class="grid">';for(let i=11;i>=0;i--){let d=new Date(n.getFullYear(),n.getMonth()-i,1),s=S(month(es,d.getFullYear(),d.getMonth()));o+=`<div class="card"><b>${d.toLocaleDateString('zh-TW',{year:'numeric',month:'short'})}</b><div class="n">${s.all}</div><div class="muted">性愛 ${s.sex} · 自慰 ${s.mast}</div></div>`}$('year12').innerHTML=o+'</div>'}function compareYears(){all().then(es=>{let y1=+$('y1').value,y2=+$('y2').value;let a=es.filter(e=>new Date(e.dt).getFullYear()===y1),b=es.filter(e=>new Date(e.dt).getFullYear()===y2);$('years').innerHTML='<div class="section">'+y1+' vs '+y2+'</div>'+deltaRow(S(a),S(b))})}
function renderSettings(){$('app').innerHTML=`<h1 style="margin:0">設定</h1><div class="card"><h2>資料備份</h2><button class="ghost" onclick="exportData()">匯出完整資料</button> <button class="ghost" onclick="$('imp').click()">匯入資料</button><input id="imp" type="file" accept=".json" hidden onchange="importData(this)"><p class="muted">匯出檔包含紀錄與照片。更新 App 時先匯出，更新後再匯入即可保留資料。</p></div><div class="card"><h2>資料儲存</h2><p class="muted">使用 IndexedDB。本版本不會主動上傳資料到伺服器。</p></div><div class="card"><button class="ghost" onclick="clearAll()">刪除全部資料</button></div>`}
function setType(t){type=t;$('bm').classList.toggle('active',t==='mast');$('bs').classList.toggle('active',t==='sex');$('sexBox').classList.toggle('hidden',t!=='sex')}async function openModal(e){$('modal').classList.remove('hidden');$('form').reset();$('id').value=e?.id||'';$('dt').value=e?.dt||new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);setType(e?.type||'mast');$('duration').value=e?.duration||'';$('ejac').checked=!!e?.ejacCount;$('ejacCount').value=e?.ejacCount||0;$('rating').value=e?.rating||'';$('partner').value=e?.partner||'';$('notes').value=e?.notes||''}function closeModal(){$('modal').classList.add('hidden')}async function editEntry(id){openModal((await all()).find(e=>e.id===id))}async function deleteEntry(id){if(confirm('確定刪除？')){await remove(id);render()}}
$('form').onsubmit=async ev=>{ev.preventDefault();let old=(await all()).find(e=>e.id===$('id').value),photos=old?.photos||[];for(let f of $('photos').files)photos.push(await new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)}));await put({id:$('id').value||crypto.randomUUID(),dt:$('dt').value,type,duration:+$('duration').value||0,ejacCount:$('ejac').checked?(+$('ejacCount').value||1):0,rating:$('rating').value,partner:$('partner').value,notes:$('notes').value,photos});closeModal();render()}
async function exportData(){let data={schemaVersion:1,exportedAt:new Date().toISOString(),entries:await all()};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='sex-journal-backup.json';a.click()}function importData(inp){let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.entries))throw 0;for(let e of x.entries)await put(e);alert('匯入完成');render()}catch{alert('檔案格式不正確')}};r.readAsText(inp.files[0])}async function clearAll(){if(confirm('確定刪除全部資料？')){for(let e of await all())await remove(e.id);render()}}
nav();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
